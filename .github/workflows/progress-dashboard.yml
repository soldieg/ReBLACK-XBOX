name: ReBLACK Xbox progress dashboard

on:
  push:
    branches: [main]
    paths:
      - tools/decompdev/progress-source.json
      - tools/decompdev/inventory-approval.json
      - tools/decompdev/build_dashboard.py
      - docs/index.html
      - docs/assets/progress.svg
      - .github/workflows/progress-dashboard.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  dashboard:
    name: Validate and publish local progress dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate approved inventory and sanitized report
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import hashlib
          import pathlib
          import sys

          root = pathlib.Path.cwd()
          approval_path = root / "tools/decompdev/inventory-approval.json"
          report_path = root / "tools/decompdev/progress-source.json"
          for path in (approval_path, report_path):
              if not path.is_file():
                  sys.exit(f"Required reviewed input is missing: {path.relative_to(root)}")

          approval = json.loads(approval_path.read_text(encoding="utf-8"))
          report = json.loads(report_path.read_text(encoding="utf-8"))
          status = approval.get("status")
          scope = approval.get("scope")
          if status == "reviewed-complete" and scope == "all-linked-units":
              report_scope = "complete"
          elif status == "reviewed-incomplete" and scope == "single-object-pilot":
              report_scope = "pilot"
              if approval.get("unit_count") != 1 or approval.get("candidate_function_count") != 16598:
                  sys.exit("Pilot scope must identify exactly one compared unit and the current 16,598-function candidate inventory.")
              if approval.get("xbe_sha256") != "DF2739C372D254A90AEECCF5971D12097F22D89FBB90DB021FDA96DD4DEB68F6":
                  sys.exit("Pilot report XBE identity does not match the recorded local evidence.")
          elif status == "reviewed-incomplete" and scope == "split-candidate-snapshot":
              report_scope = "candidate-snapshot"
              if approval.get("unit_count") != 13676 or approval.get("split_manifest_count") != 13676:
                  sys.exit("Candidate snapshot must cover all 13,676 XboxRecomp split-manifest entries.")
              if approval.get("candidate_function_count") != 16598:
                  sys.exit("Candidate snapshot must record the separate 16,598-entry refined detector inventory.")
              if approval.get("expected_total_code_bytes") != 2297156:
                  sys.exit("Candidate snapshot code-byte denominator does not match the reviewed split manifest.")
              if approval.get("xbe_sha256") != "DF2739C372D254A90AEECCF5971D12097F22D89FBB90DB021FDA96DD4DEB68F6":
                  sys.exit("Candidate snapshot XBE identity does not match the recorded local evidence.")
              report_sha256 = hashlib.sha256(report_path.read_bytes()).hexdigest()
              if approval.get("report_sha256") != report_sha256:
                  sys.exit("Candidate report hash does not match the reviewed approval record.")
          else:
              sys.exit("Report scope must be reviewed-complete/all-linked-units, reviewed-incomplete/single-object-pilot, or reviewed-incomplete/split-candidate-snapshot.")
          expected = approval.get("unit_count")
          units = report.get("units")
          if type(expected) is not int or expected <= 0 or not isinstance(units, list) or len(units) != expected:
              sys.exit("Report units do not match the reviewed complete inventory count.")
          if report.get("version") != 2 or not isinstance(report.get("measures"), dict):
              sys.exit("The report must use objdiff report version 2 and include measures.")
          if report["measures"].get("total_units") != expected:
              sys.exit("Report aggregate total_units does not match the reviewed inventory.")
          if report_scope == "pilot":
              if expected != 1 or units[0].get("name") != "pilot/sub_0003F180":
                  sys.exit("Pilot report must contain only the recorded sub_0003F180 unit.")
              if units[0].get("metadata", {}).get("complete") is not False:
                  sys.exit("Pilot unit must be explicitly marked incomplete.")
              if report["measures"].get("total_code") != "85" or report["measures"].get("total_functions") != 1:
                  sys.exit("Pilot aggregate measures do not match the recorded 85-byte, one-function comparison.")
          elif report_scope == "candidate-snapshot":
              if report["measures"].get("total_code") != "2297156" or report["measures"].get("total_functions") != 13676:
                  sys.exit("Candidate snapshot aggregates do not match the approved split-manifest inventory.")
              if any(not isinstance(unit.get("name"), str) or not unit["name"].startswith("candidate/") for unit in units):
                  sys.exit("Candidate snapshot units must be named candidate/<function>.")
              if any(unit.get("metadata", {}).get("complete") is not False for unit in units):
                  sys.exit("Every candidate snapshot unit must remain explicitly incomplete.")

          report_keys = {"version", "measures", "units", "categories"}
          measure_keys = {"fuzzy_match_percent", "total_code", "matched_code", "matched_code_percent", "total_data", "matched_data", "matched_data_percent", "total_functions", "matched_functions", "matched_functions_percent", "complete_code", "complete_code_percent", "complete_data", "complete_data_percent", "total_units", "complete_units"}
          unit_keys = {"name", "measures", "sections", "functions", "metadata"}
          item_keys = {"name", "size", "fuzzy_match_percent", "metadata", "address"}
          unit_meta_keys = {"complete", "module_name", "module_id", "progress_categories", "auto_generated"}
          item_meta_keys = {"demangled_name", "virtual_address"}

          def path_like(value):
              return value.startswith("/") or value.startswith(chr(92)) or (len(value) > 1 and value[1] == ":")

          def reject_paths(value, where="report"):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if "path" in key.lower():
                          raise ValueError(f"{where}.{key} exposes a local path")
                      reject_paths(child, where + "." + key)
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      reject_paths(child, f"{where}[{index}]")
              elif isinstance(value, str) and path_like(value):
                  raise ValueError(f"{where} contains an absolute path")

          def check_keys(obj, allowed, where):
              if not isinstance(obj, dict):
                  raise ValueError(f"{where} must be an object")
              extra = set(obj) - allowed
              if extra:
                  raise ValueError(f"{where} contains unapproved fields: {sorted(extra)}")

          def check_measures(value, where):
              check_keys(value, measure_keys, where)

          def check_item(item, where):
              check_keys(item, item_keys, where)
              if not isinstance(item.get("name"), str) or path_like(item["name"]):
                  raise ValueError(f"{where}.name is invalid or path-like")
              if "metadata" in item:
                  check_keys(item["metadata"], item_meta_keys, where + ".metadata")

          try:
              check_keys(report, report_keys, "report")
              check_measures(report["measures"], "report.measures")
              if not isinstance(units, list):
                  raise ValueError("report.units must be an array")
              names = set()
              for index, unit in enumerate(units):
                  where = f"units[{index}]"
                  check_keys(unit, unit_keys, where)
                  name = unit.get("name")
                  if not isinstance(name, str) or not name or path_like(name) or name in names:
                      raise ValueError(f"{where}.name is missing, duplicated, or path-like")
                  names.add(name)
                  check_measures(unit.get("measures"), where + ".measures")
                  for kind in ("sections", "functions"):
                      items = unit.get(kind, [])
                      if not isinstance(items, list):
                          raise ValueError(f"{where}.{kind} must be an array")
                      for item_index, item in enumerate(items):
                          check_item(item, f"{where}.{kind}[{item_index}]")
                  if "metadata" in unit:
                      check_keys(unit["metadata"], unit_meta_keys, where + ".metadata")
              categories = report.get("categories", [])
              if not isinstance(categories, list):
                  raise ValueError("report.categories must be an array")
              for index, category in enumerate(categories):
                  check_keys(category, {"id", "name", "measures"}, f"categories[{index}]")
                  check_measures(category.get("measures"), f"categories[{index}].measures")
              reject_paths(report)
          except (TypeError, ValueError) as error:
              sys.exit(f"Report rejected: {error}")

          if report_scope == "pilot":
              summary = pathlib.Path(__import__("os").environ["GITHUB_STEP_SUMMARY"])
              summary.write_text(
                  "## ReBlack Xbox report — INCOMPLETE PILOT\n\n"
                  "This artifact contains one 85-byte candidate only (3.7906976% fuzzy match). "
                  "It is **not** whole-game progress and must not be treated as a complete inventory.\n\n"
                  "The XBE candidate inventory currently has 16,598 detected functions; the report covers 1 pilot unit.\n",
                  encoding="utf-8",
              )
              print("Validated objdiff v2 pilot report: 1 explicitly incomplete unit; not whole-game progress.")
          elif report_scope == "candidate-snapshot":
              summary = pathlib.Path(__import__("os").environ["GITHUB_STEP_SUMMARY"])
              measures = report["measures"]
              summary.write_text(
                  "## ReBlack Xbox report — INCOMPLETE CANDIDATE SNAPSHOT\n\n"
                  f"This report contains {expected:,} XboxRecomp split candidates and {measures.get('total_code')} candidate code bytes. "
                  f"Objdiff measured {measures.get('matched_code', '0')} exact bytes "
                  f"({measures.get('matched_code_percent', 0)}% exact; {measures.get('fuzzy_match_percent', 0)}% fuzzy) "
                  f"across {measures.get('matched_functions', 0)} exact functions.\n\n"
                  "All units are marked incomplete. The split manifest is heuristic, has overlapping ranges, and is not a complete linked-unit inventory; "
                  "do not interpret these percentages as whole-game completion.\n",
                  encoding="utf-8",
              )
              print(f"Validated objdiff v2 incomplete candidate snapshot: {expected} candidate units; not whole-game progress.")
          else:
              print(f"Validated objdiff v2 complete report: {expected} units; no local paths or extra fields.")
          PY
      - name: Build local dashboard
        shell: bash
        run: python3 tools/decompdev/build_dashboard.py --report tools/decompdev/progress-source.json --output-dir build/pages --badge docs/assets/progress.svg --check-badge
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: build/pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@f33f41b675f0ab2dc5a6863c9a170fe83af3571e # v4.0.0
