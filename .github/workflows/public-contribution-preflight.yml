name: Public contribution preflight

on:
  pull_request:
    paths:
      - reconstructions/**
      - tools/decompdev/validate_public_contributions.py
      - tools/decompdev/build_dashboard.py
      - tests/**
      - .github/**

permissions:
  contents: read

jobs:
  preflight:
    name: Format and public-data safety
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out pull request source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Run dashboard metadata checks
        env:
          PYTHONPATH: tools/decompdev
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Check public contribution files
        env:
          PR_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          args=()
          if [[ "$PR_AUTHOR_ASSOCIATION" =~ ^(OWNER|MEMBER|COLLABORATOR)$ ]]; then
            args+=(--maintainer-authorized)
          fi
          python tools/decompdev/validate_public_contributions.py --base "${{ github.event.pull_request.base.sha }}" "${args[@]}"
